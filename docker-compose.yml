services:
  postgres:
    image: postgres:17-alpine
    container_name: tomori-postgres
    environment:
      POSTGRES_DB: tomori
      POSTGRES_USER: tomori
      POSTGRES_PASSWORD: tomori_local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tomori -d tomori"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
